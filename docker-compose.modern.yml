version: '3.8'

services:
  # Node.js任务编排服务
  node-orchestrator:
    build: ./src/backend/nodejs-orchestrator
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EMBEDDING_SERVICE=http://embedding-service:8001
      - RERANK_SERVICE=http://rerank-service:8002
      - LLM_SERVICE=http://llm-service:8003
    volumes:
      - ./src/backend/nodejs-orchestrator:/app
      - /app/node_modules
    depends_on:
      - redis
      - embedding-service
      - rerank-service
      - llm-service
    restart: unless-stopped
    networks:
      - rag-network

  # Python Embedding服务
  embedding-service:
    build: ./src/backend/python-legacy
    command: python rag_unified_api.py
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/models
      - ./data:/data
    networks:
      - rag-network
    restart: unless-stopped

  # Python Rerank服务
  rerank-service:
    build: ./src/backend/python-legacy
    command: python -c "
from rag_llm_pipeline import RerankService
from rag_enhanced_api import app
import uvicorn
uvicorn.run(app, host='0.0.0.0', port=8002)
"
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/models
      - ./data:/data
    networks:
      - rag-network
    restart: unless-stopped

  # Python LLM服务
  llm-service:
    build: ./src/backend/python-legacy
    command: python -c "
from llm_service import LLMService
import uvicorn
app = FastAPI()
llm_service = LLMService()

@app.post('/api/generate')
async def generate(request):
    return await llm_service.generate(request.query, request.options)

uvicorn.run(app, host='0.0.0.0', port=8003)
"
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - rag-network
    restart: unless-stopped

  # Redis缓存和消息队列
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rag-network
    restart: unless-stopped

  # PostgreSQL数据库
  postgres:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=rag_db
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - rag-network
    restart: unless-stopped

  # Qdrant向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag-network
    restart: unless-stopped

  # 前端React应用
  frontend:
    build: ./src/frontend/web
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:3000
      - REACT_APP_WS_URL=ws://localhost:3000
    depends_on:
      - node-orchestrator
    networks:
      - rag-network
    restart: unless-stopped

networks:
  rag-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  qdrant_data:
cache:
  db: 0
  host: localhost
  max_connections: 50
  port: 6379
  ttl: 3600
  type: redis
context:
  max_length: 2000
  strategy: surrounding
  surrounding_window: 2
debug: true
env: dev
fusion_weights:
  graph: 0.05
  keyword: 0.2
  rerank: 0.4
  time: 0.05
  vector: 0.3
graph_store:
  database: neo4j
  password: password
  type: neo4j
  uri: bolt://localhost:7687
  username: neo4j
keyword_store:
  hosts:
  - http://localhost:9200
  index_name: documents
  type: elasticsearch
logging:
  format: json
  level: INFO
  output: stdout
metrics:
  enabled: true
  path: /metrics
  port: 9090
models:
  embedding:
    batch_size: 32
    device: cpu
    name: BAAI/bge-m3
    normalize_embeddings: true
  rerank:
    batch_size: 8
    device: cpu
    max_length: 512
    name: BAAI/bge-reranker-large
  tei:
    enabled: true
    max_batch_tokens: 16384
    max_client_batch_size: 64
    model_id: BAAI/bge-m3
    url: http://localhost:8003
ocr_quality:
  confidence_threshold: 0.85
  enable_llm_verify: true
  layout_consistency_threshold: 0.8
  max_retries: 3
  retry_strategies:
  - description: 增强对比度
    name: increase_contrast
  - description: 纠偏校正
    name: deskew_correction
  - description: 增强表格检测
    name: enhance_table_detection
  table_integrity_threshold: 0.9
query_analysis:
  enable_entity_extraction: true
  enable_intent_classification: true
  enable_subquery_decomposition: true
  intent_thresholds:
    comparison: 0.7
    list: 0.6
    numeric: 0.6
    procedure: 0.6
    trend: 0.7
  max_subqueries: 5
reranker:
  weights:
    bm25: 0.35
    graph: 0.2
    semantic: 0.45
retrieval:
  enable_fusion: true
  enable_rerank: true
  graph_top_k: 10
  keyword_top_k: 20
  score_threshold: 0.6
  vector_top_k: 30
server:
  host: 0.0.0.0
  port: 8000
  reload: true
  workers: 1
services:
  api:
    cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
    enabled: true
    port: 8000
  ocr:
    detect_figures: false
    detect_tables: true
    enabled: true
    gpu: false
    language: ch
    port: 8001
  recursion:
    enabled: false
    max_depth: 3
    port: 3001
    timeout_seconds: 300
    websocket: true
structured_store:
  database: rag_db
  host: localhost
  port: 5432
  table_formats:
  - json
  - markdown
  - csv
  type: postgresql
vector_store:
  collection_name: documents
  host: localhost
  pool_size: 10
  port: 6333
  timeout: 30
  type: qdrant
  vector_size: 1024

# Local-only overrides for docker-compose.yml
#
# Purpose:
#   The shared frontend image expects TLS certs for threefirestone.com because
#   prod terminates HTTPS in the rag-frontend nginx container. Locally we don't
#   have those certs, so this override mounts self-signed ones generated by
#   infrastructure/local-certs/ and exposes ports 80/443 on the host.
#
# Apply automatically: docker compose picks this file up if it is named
# docker-compose.override.yml.

services:
  frontend:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/local-certs:/etc/nginx/certs:ro

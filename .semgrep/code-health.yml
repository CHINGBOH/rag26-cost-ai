rules:
  - id: node-runtime-no-process-env-outside-config
    message: Route Node runtime environment access through src/backend/server/src/config/runtime.ts or bootstrap-env.ts.
    severity: WARNING
    languages: [typescript]
    pattern-either:
      - pattern: process.env.$VAR
      - pattern: process.env["..."]
      - pattern: process.env['...']
    paths:
      include:
        - /src/backend/server/src/**/*.ts
      exclude:
        - /src/backend/server/src/config/runtime.ts
        - /src/backend/server/src/config/bootstrap-env.ts
        - /src/backend/server/src/**/*.test.ts
        - /src/backend/server/src/**/*.spec.ts
        - /src/backend/server/src/**/__tests__/**

  - id: frontend-runtime-no-import-meta-env-outside-runtime
    message: Route frontend env access through src/frontend/web/src/config/runtime.ts.
    severity: WARNING
    languages: [typescript]
    pattern-either:
      - pattern: import.meta.env.$VAR
      - pattern: import.meta.env["..."]
      - pattern: import.meta.env['...']
    paths:
      include:
        - /src/frontend/web/src/**/*.ts
        - /src/frontend/web/src/**/*.tsx
      exclude:
        - /src/frontend/web/src/config/runtime.ts
        - /src/frontend/web/src/**/*.test.ts
        - /src/frontend/web/src/**/*.test.tsx
        - /src/frontend/web/src/**/*.spec.ts
        - /src/frontend/web/src/**/*.spec.tsx
        - /src/frontend/web/src/**/__tests__/**

  - id: python-runtime-no-env-outside-canonical-config
    message: Route Python env access through the canonical runtime config surface instead of direct os.getenv/os.environ.get reads.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: os.getenv(...)
      - pattern: os.environ.get(...)
    paths:
      include:
        - /src/backend/python-legacy/**/*.py
        - /src/backend/retrieval-service/**/*.py
      exclude:
        - /src/backend/python-legacy/config/runtime.py
        - /src/backend/python-legacy/config/settings.py
        - /src/backend/python-legacy/tests/**
        - /src/backend/retrieval-service/app/runtime_config.py
        - /src/backend/retrieval-service/app/runtime_overrides.py
        - /src/backend/retrieval-service/tests/**

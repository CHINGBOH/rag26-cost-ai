# docker-compose.2g.yml — memory-constrained override for 2 GB / 4-core servers
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.2g.yml up -d
#
# What this file does:
#   • Caps every service with a hard mem_limit so the host does not OOM
#   • Tunes PostgreSQL and Redis for low RAM
#   • Switches embedding models to small variants (~200 MB each vs 1.5 GB each)
#   • Switches reranker to a lighter model (~300 MB vs 1.5 GB)
#   • Forces EMBEDDING_BACKEND=local (no TEI/GPU required)
#   • Requires at least 4 GB swap on the host (see DEPLOY.md § 2GB server)

version: "3.9"

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    command: >
      postgres
      -c max_connections=20
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c wal_buffers=4MB
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 192M

  qdrant:
    deploy:
      resources:
        limits:
          memory: 384M

  # ── Application services ───────────────────────────────────────────────────

  python-legacy:
    environment:
      # Small embedding model: ~90 MB disk, ~200 MB RAM (vs bge-m3 570 MB / 1.5 GB)
      EMBEDDING_BACKEND: "local"
      EMBEDDING_MODEL_NAME: "BAAI/bge-small-zh-v1.5"
      EMBEDDING_MODEL_DEVICE: "cpu"
      # Lighter reranker: ~280 MB RAM (vs bge-reranker-v2-m3 at 1.5 GB)
      RERANKER_MODEL_NAME: "BAAI/bge-reranker-base"
      RERANKER_MODEL_DEVICE: "cpu"
    deploy:
      resources:
        limits:
          memory: 640M

  retrieval-service:
    environment:
      EMBEDDING_BACKEND: "local"
      EMBEDDING_MODEL_NAME: "BAAI/bge-small-zh-v1.5"
      EMBEDDING_MODEL_DEVICE: "cpu"
      RERANKER_MODEL_NAME: "BAAI/bge-reranker-base"
      RERANKER_MODEL_DEVICE: "cpu"
    deploy:
      resources:
        limits:
          memory: 768M

  node-server:
    deploy:
      resources:
        limits:
          memory: 384M

  go-gateway:
    deploy:
      resources:
        limits:
          memory: 64M

  go-websocket:
    deploy:
      resources:
        limits:
          memory: 64M

  frontend:
    deploy:
      resources:
        limits:
          memory: 64M

name: Code Health Advisory

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  advisory-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install workspace dependencies
        run: npm ci

      - name: Install advisory Python scanners
        run: python -m pip install semgrep vulture deptry lizard

      - name: Install Qlty
        run: |
          curl https://qlty.sh | sh
          echo "$HOME/.qlty/bin" >> "$GITHUB_PATH"

      - name: Install actionlint and staticcheck
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install shellcheck and hadolint
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          HVER=2.12.0
          curl -fsSL -o /tmp/hadolint "https://github.com/hadolint/hadolint/releases/download/v${HVER}/hadolint-Linux-x86_64"
          sudo install /tmp/hadolint /usr/local/bin/hadolint

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Baseline checks
        run: |
          npm run check:resource-index
          npm run typecheck
          npm test

      - name: Qlty advisory scan
        continue-on-error: true
        run: qlty check

      - name: TS/JS advisory scan
        continue-on-error: true
        run: npm run audit:advisory

      - name: Semgrep advisory scan
        continue-on-error: true
        run: |
          mkdir -p reports
          semgrep scan --config .semgrep/code-health.yml --json --output reports/semgrep.json .

      - name: Python dead code and dependency scan
        continue-on-error: true
        run: |
          python -m vulture src/backend/python-legacy src/backend/retrieval-service --min-confidence 100
          deptry .

      - name: Go static analysis
        continue-on-error: true
        run: staticcheck ./...

      - name: Secret scan
        continue-on-error: true
        run: |
          mkdir -p reports
          gitleaks git --report-format sarif --report-path reports/gitleaks.sarif --exit-code 0

      - name: Workflow and shell scan
        continue-on-error: true
        run: |
          actionlint
          find . -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
          find tests scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Dockerfile scan
        continue-on-error: true
        run: |
          find . -type f \( -name 'Dockerfile' -o -name 'Dockerfile.*' \) -print0 | xargs -0 -r -n 1 hadolint

      - name: Upload advisory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-health-advisory-reports
          if-no-files-found: ignore
          path: |
            reports/**

name: Topology Health (#94 I6)

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  topology-health:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
          POSTGRES_DB: rag_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install runtime deps
        run: pip install psycopg2-binary

      - name: Apply migrations + seed minimum schema
        env:
          PGPASSWORD: rag_password
        run: |
          # Minimal schema for I3 check (text_chunks) + feedback for I2
          psql -h localhost -U rag_user -d rag_db <<'SQL'
          CREATE TABLE IF NOT EXISTS text_chunks (
            id BIGSERIAL PRIMARY KEY,
            file_name TEXT, path TEXT, metadata JSONB
          );
          CREATE TABLE IF NOT EXISTS rag_feedback (
            id BIGSERIAL PRIMARY KEY,
            ts DOUBLE PRECISION NOT NULL DEFAULT EXTRACT(epoch FROM now()),
            session_id TEXT NOT NULL,
            message_id TEXT NOT NULL,
            rating SMALLINT NOT NULL,
            overall_rating SMALLINT,
            comment TEXT,
            query TEXT,
            answer_summary TEXT,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          SQL
          psql -h localhost -U rag_user -d rag_db -f sql/migrations/202605_learning_signals.sql
          # Seed dummy chunk so I3 has data to score
          psql -h localhost -U rag_user -d rag_db -c \
            "INSERT INTO text_chunks (file_name, path, metadata) VALUES ('seed.md','docs/seed.md','{}'::jsonb);"
          # Seed a recent radar entry for I5
          psql -h localhost -U rag_user -d rag_db -c \
            "INSERT INTO tech_radar (source, external_id, title, fetched_at) VALUES
             ('arxiv','ci-seed-1','CI seed', NOW()),
             ('github','ci-seed-2','CI seed', NOW())
             ON CONFLICT DO NOTHING;"

      - name: Run topology_health.py --strict
        env:
          DATABASE_URL: postgresql://rag_user:rag_password@localhost:5432/rag_db
        run: python scripts/topology_health.py --strict

      - name: Print JSON report on failure
        if: failure()
        env:
          DATABASE_URL: postgresql://rag_user:rag_password@localhost:5432/rag_db
        run: python scripts/topology_health.py --json

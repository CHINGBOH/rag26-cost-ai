# RAG Dashboard — Minimum stack
#
# 5 services only. Everything else (milvus/etcd/minio, elasticsearch, neo4j,
# python-legacy, node-server, go-gateway, go-websocket) has been removed.
# The full historical compose file is preserved as docker-compose.yml.full
# for reference if you ever need to bring those services back.

services:
  postgres:
    build:
      context: ./docker
      dockerfile: Dockerfile.postgres
    image: rag-postgres:16-zhparser
    container_name: rag-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: rag_dashboard
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [rag-network]

  redis:
    image: redis:7.2-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [rag-network]

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | head -1 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [rag-network]

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    container_name: rag-tei
    ports:
      - "8003:80"
    volumes:
      - tei_models:/data
    command: >
      --model-id BAAI/bge-m3
      --revision main
      --port 80
      --max-batch-tokens 16384
      --max-client-batch-size 64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks: [rag-network]

  retrieval-service:
    build:
      context: ./src/backend/retrieval-service
      dockerfile: Dockerfile
    container_name: rag-retrieval-service
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      DATABASE_URL: postgresql://rag_user:rag_password@postgres:5432/rag_dashboard
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: rag_dashboard
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      TEI_URL: http://tei:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks: [rag-network]

networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_storage:
  tei_models:

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- API proxies ---
    # /api/agent  → Node orchestrator (bypasses Go Gateway, mirrors vite dev proxy)
    location /api/agent {
        proxy_pass http://node-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # /api/v1/*  → retrieval-service (mirrors vite dev proxy)
    location /api/v1/ {
        proxy_pass http://retrieval-service:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # /api/*  /health  /metrics  → Go API Gateway
    location /api/ {
        proxy_pass http://go-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location /health {
        proxy_pass http://go-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /metrics {
        proxy_pass http://go-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # /ws  → Go WebSocket Gateway
    location /ws {
        proxy_pass http://go-websocket:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: all unmatched routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

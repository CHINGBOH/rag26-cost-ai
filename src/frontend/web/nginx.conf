# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name threefirestone.com www.threefirestone.com;

    ssl_certificate     /etc/nginx/certs/threefirestone.com_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/threefirestone.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api/agent {
        proxy_pass http://node-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /api/v1/health {
        default_type application/json;
        if ($request_method = HEAD) {
            return 200;
        }
        proxy_pass http://retrieval-service:8002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/v1/ {
        proxy_pass http://retrieval-service:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://go-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://go-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        proxy_pass http://go-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://go-websocket:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Static showcase pages mounted from /srv/apps/threefirestone/showcase.
    # Independent Vite homepage. Keep it out of the heavy RAG SPA bundle.
    location = / {
        root /usr/share/nginx/showcase/home;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    location = /home { return 301 /; }
    location /home/ {
        alias /usr/share/nginx/showcase/home/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /resume.html {
        alias /usr/share/nginx/showcase/boone/resume.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    location = /boone { return 301 /boone/; }
    location /boone/ {
        alias /usr/share/nginx/showcase/boone/;
        try_files $uri $uri/ /boone/index.html;
    }

    location /js/ {
        alias /usr/share/nginx/showcase/boone/js/;
    }

    location /data/ {
        alias /usr/share/nginx/showcase/boone/data/;
    }

    location /docs/ {
        alias /usr/share/nginx/showcase/boone/docs/;
        try_files $uri $uri/ =404;
    }

    location = /lecture { return 301 /lecture/; }
    location /lecture/ {
        alias /usr/share/nginx/showcase/lecture/;
        try_files $uri $uri/ /lecture/index.html;
    }

    location = /beautyos { return 301 /beautyos/; }
    location /beautyos/ {
        alias /usr/share/nginx/showcase/beautyos/;
        try_files $uri $uri/ /beautyos/index.html;
    }

    location = /beauty { return 301 /beautyos/; }
    location /beauty/ { return 301 /beautyos/; }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangChain RAG 架构完全指南</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--primary:#6366f1;--primary-dark:#4f46e5;--secondary:#10b981;--accent:#f59e0b;--danger:#ef4444;--bg-dark:#0f172a;--bg-card:#1e293b;--bg-card-hover:#334155;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--border:#475569}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-dark);color:var(--text-primary);line-height:1.6;min-height:100vh}
        .container{max-width:1400px;margin:0 auto;padding:0 20px}
        .header{background:linear-gradient(135deg,var(--primary-dark) 0%,#7c3aed 100%);padding:60px 0 80px;text-align:center;position:relative;overflow:hidden}
        .header::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
        .header-content{position:relative;z-index:1}
        .badge{display:inline-block;background:rgba(255,255,255,0.2);padding:6px 16px;border-radius:20px;font-size:14px;margin-bottom:20px}
        .header h1{font-size:3.5rem;font-weight:800;margin-bottom:20px;background:linear-gradient(90deg,#fff 0%,#a5b4fc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .header p{font-size:1.3rem;opacity:0.9;max-width:600px;margin:0 auto}
        .nav-container{background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
        .nav-tabs{display:flex;gap:8px;padding:16px 20px;overflow-x:auto}
        .nav-tab{padding:10px 20px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:all 0.2s;background:transparent;border:none;color:var(--text-secondary);font-size:15px;font-weight:500}
        .nav-tab:hover{background:var(--bg-card-hover);color:var(--text-primary)}
        .nav-tab.active{background:var(--primary);color:white}
        .main-content{padding:40px 0}
        .section{margin-bottom:80px;animation:fadeIn 0.5s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .section-title{font-size:2.2rem;font-weight:700;margin-bottom:30px;display:flex;align-items:center;gap:16px}
        .section-number{background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800}
        .card{background:var(--bg-card);border-radius:16px;padding:30px;border:1px solid var(--border);transition:all 0.3s;margin-bottom:24px}
        .card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 20px 40px rgba(0,0,0,0.3)}
        .card-title{font-size:1.4rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:12px}
        .card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
        .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:24px}
        .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
        .diagram{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border-radius:12px;padding:30px;margin:24px 0;border:1px solid var(--border)}
        .diagram-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
        .diagram-box{padding:16px 24px;border-radius:8px;font-weight:600;text-align:center;min-width:120px}
        .diagram-arrow{color:var(--text-secondary);font-size:1.5rem}
        .box-input{background:#22c55e;color:#000}
        .box-process{background:var(--primary);color:#fff}
        .box-output{background:#f59e0b;color:#000}
        .box-decision{background:var(--accent);color:#000;border:2px dashed #000}
        .box-tool{background:#8b5cf6;color:#fff}
        .box-agent{background:#ec4899;color:#fff}
        .comparison-table{width:100%;border-collapse:collapse;margin:24px 0}
        .comparison-table th,.comparison-table td{padding:16px;text-align:left;border-bottom:1px solid var(--border)}
        .comparison-table th{background:var(--bg-card-hover);font-weight:600}
        .comparison-table tr:hover td{background:rgba(99,102,241,0.1)}
        .tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
        .tag-high{background:#22c55e;color:#000}
        .tag-medium{background:#f59e0b;color:#000}
        .tag-low{background:#ef4444;color:#fff}
        .tag-fast{background:#06b6d4;color:#000}
        .tag-variable{background:#8b5cf6;color:#fff}
        .code-block{background:#0d1117;border-radius:8px;padding:20px;margin:16px 0;overflow-x:auto;border:1px solid var(--border)}
        .code-block pre{font-family:'Fira Code','Monaco',monospace;font-size:14px;line-height:1.6;color:#c9d1d9}
        .analogy-box{background:linear-gradient(135deg,rgba(99,102,241,0.1) 0%,rgba(16,185,129,0.1) 100%);border-left:4px solid var(--primary);padding:24px;margin:24px 0;border-radius:0 12px 12px 0}
        .analogy-title{font-size:1.2rem;font-weight:600;margin-bottom:12px;color:var(--accent)}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
        .flow-step{animation:pulse 2s infinite}
        .flow-step:nth-child(2){animation-delay:0.2s}
        .flow-step:nth-child(3){animation-delay:0.4s}
        .flow-step:nth-child(4){animation-delay:0.6s}
        .flow-step:nth-child(5){animation-delay:0.8s}
        .emoji-big{font-size:3rem;text-align:center;margin:20px 0}
        .highlight{background:linear-gradient(90deg,var(--primary) 0%,var(--secondary) 100%);padding:2px 8px;border-radius:4px;color:#fff}
        .warning-box{background:rgba(245,158,11,0.1);border:1px solid var(--accent);border-radius:12px;padding:20px;margin:20px 0}
        .warning-title{font-weight:600;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:8px}
        .footer{background:var(--bg-card);padding:40px 0;text-align:center;border-top:1px solid var(--border);margin-top:80px}
        .mode-indicator{text-align:center;padding:20px;border-radius:12px;cursor:pointer;transition:all 0.3s;flex:1;max-width:300px;border:2px solid transparent}
        .mode-indicator:hover{transform:scale(1.02)}
        .mode-indicator.active{transform:scale(1.05);box-shadow:0 10px 30px rgba(0,0,0,0.3)}
        .mode-indicator h3{font-size:1.3rem;margin-bottom:8px}
        .mode-indicator p{color:var(--text-secondary);font-size:14px}
        .timeline{position:relative;padding-left:40px}
        .timeline::before{content:'';position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--border)}
        .timeline-item{position:relative;margin-bottom:30px}
        .timeline-item::before{content:'';position:absolute;left:-33px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid var(--bg-dark)}
        .timeline-content{padding:20px;background:var(--bg-card);border-radius:12px;border:1px solid var(--border)}
        .timeline-title{font-weight:600;margin-bottom:8px}
        .timeline-desc{color:var(--text-secondary);font-size:14px}
        @media(max-width:768px){.header h1{font-size:2rem}.section-title{font-size:1.6rem}.grid-2,.grid-3{grid-template-columns:1fr}.diagram-row{flex-direction:column}.diagram-arrow{transform:rotate(90deg)}}
        ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg-dark)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
const {useState}=React;

const Header=()=>(
    <header className="header">
        <div className="header-content container">
            <span className="badge">📚 完整指南 · 图文并茂</span>
            <h1>LangChain RAG 架构完全指南</h1>
            <p>从零开始理解检索增强生成架构 · 专业视角 + 通俗解读</p>
        </div>
    </header>
);

const Navigation=({activeSection,setActiveSection})=>{
    const sections=[
        {id:'overview',label:'📖 概览'},
        {id:'what-is-rag',label:'🤔 什么是RAG'},
        {id:'langchain',label:'🧩 LangChain'},
        {id:'rag-modes',label:'🔄 RAG模式'},
        {id:'langgraph',label:'🛤️ LangGraph'},
        {id:'multi-agent',label:'👥 Multi-Agent'},
        {id:'memory',label:'🧠 Memory'},
        {id:'integration',label:'🔗 整合策略'},
        {id:'summary',label:'📝 总结'}
    ];
    return(
        <nav className="nav-container">
            <div className="nav-tabs container">
                {sections.map(s=>(
                    <button key={s.id} className={`nav-tab ${activeSection===s.id?'active':''}`} onClick={()=>setActiveSection(s.id)}>{s.label}</button>
                ))}
            </div>
        </nav>
    );
};

const OverviewSection=()=>(
    <section id="overview" className="section">
        <h2 className="section-title"><span className="section-number">0</span>概览</h2>
        <div className="analogy-box">
            <div className="analogy-title">🎯 这份指南要告诉你什么？</div>
            <p>想象你是<strong>指挥官</strong>，要带领AI打一场"知识战"！</p>
            <ul style={{marginLeft:'20px',marginTop:'12px'}}>
                <li>如何让AI学会<span className="highlight">"查资料"</span>（RAG）</li>
                <li>如何用<span className="highlight">"乐高积木"</span>搭AI应用（LangChain）</li>
                <li>如何画<span className="highlight">"流程图"</span>让AI按规矩干活（LangGraph）</li>
                <li>如何指挥<span className="highlight">"一群AI小弟"</span>协同作战（Multi-Agent）</li>
                <li>如何让AI<span className="highlight">"记住重要的事"</span>（Memory）</li>
            </ul>
        </div>
        <div className="emoji-big">🎓 → 🧠 → 🛠️ → 🚂 → 👥 → 💾</div>
        <div className="grid-2">
            <div className="card" style={{borderLeft:'4px solid #6366f1'}}>
                <div className="card-title"><span className="card-icon" style={{background:'#6366f1'}}>👨‍💻</span>专业视角</div>
                <p style={{color:'var(--text-secondary)'}}>面向技术人员，包含完整的架构图、代码示例、技术选型建议。</p>
            </div>
            <div className="card" style={{borderLeft:'4px solid #ef4444'}}>
                <div className="card-title"><span className="card-icon" style={{background:'#ef4444'}}>👴</span>通俗解读</div>
                <p style={{color:'var(--text-secondary)'}}>用"街头王大爷都能听懂"的大白话解释概念。</p>
            </div>
        </div>
        <div className="diagram">
            <h3 style={{textAlign:'center',marginBottom:'24px'}}>🗺️ LangChain RAG 学习路径</h3>
            <div className="diagram-row">
                <div className="diagram-box box-input flow-step">🤔 RAG</div>
                <span className="diagram-arrow">→</span>
                <div className="diagram-box box-process flow-step">🧩 组件</div>
                <span className="diagram-arrow">→</span>
                <div className="diagram-box box-tool flow-step">🔄 模式</div>
                <span className="diagram-arrow">→</span>
                <div className="diagram-box box-agent flow-step">🛤️ 图</div>
                <span className="diagram-arrow">→</span>
                <div className="diagram-box box-output flow-step">📚 整合</div>
            </div>
        </div>
    </section>
);

const WhatIsRAGSection=()=>(
    <section id="what-is-rag" className="section">
        <h2 className="section-title"><span className="section-number">1</span>什么是 RAG？</h2>
        <div className="emoji-big">🤖 ❓ 📚</div>
        <div className="card">
            <div className="card-title"><span className="card-icon" style={{background:'#22c55e'}}>🤖</span>AI 的两个固有问题</div>
            <div className="grid-2" style={{marginTop:'16px'}}>
                <div style={{padding:'16px',background:'rgba(239,68,68,0.1)',borderRadius:'8px'}}>
                    <h4 style={{color:'#ef4444',marginBottom:'8px'}}>❌ 记性有截止日期</h4>
                    <p style={{color:'var(--text-secondary)',fontSize:'14px'}}>AI 学的东西都有"保质期"，训练完成后的事它就不知道了。</p>
                </div>
                <div style={{padding:'16px',background:'rgba(245,158,11,0.1)',borderRadius:'8px'}}>
                    <h4 style={{color:'#f59e0b',marginBottom:'8px'}}>❌ 脑子装不下太多</h4>
                    <p style={{color:'var(--text-secondary)',fontSize:'14px'}}>AI 一次能处理的内容有限，让它看一整个图书馆的书？它脑子会炸！</p>
                </div>
            </div>
        </div>
        <div className="analogy-box">
            <div className="analogy-title">💡 RAG = 检索增强的说话能力</div>
            <p><strong>以前</strong>：AI 说话就像闭眼老中医，全凭记忆</p>
            <p style={{marginTop:'8px'}}><strong>有了RAG</strong>：AI 就像有了百度搜索+图书馆外挂的老中医，不知道的现查！</p>
        </div>
        <div className="grid-2">
            <div className="card">
                <div className="card-title"><span className="card-icon" style={{background:'#ef4444'}}>🚫</span>没 RAG 的时候</div>
                <div className="code-block" style={{margin:0}}><pre>{`问: "咱们小区维修基金..."
答: "抱歉，我不知道。"`}</pre></div>
            </div>
            <div className="card">
                <div className="card-title"><span className="card-icon" style={{background:'#22c55e'}}>✅</span>有 RAG 的时候</div>
                <div className="code-block" style={{margin:0}}><pre>{`问: "咱们小区维修基金..."
AI: "等等，我查查..."
AI: "根据5月3号会议记录..."`}</pre></div>
            </div>
        </div>
        <h3 style={{marginTop:'40px',marginBottom:'20px'}}>🔬 RAG 工作原理</h3>
        <div className="diagram">
            <div className="diagram-row" style={{flexDirection:'column',gap:'20px'}}>
                <div className="diagram-row">
                    <div className="diagram-box box-input">👤 你提问</div>
                    <span className="diagram-arrow">→</span>
                    <div className="diagram-box box-process">🔍 检索</div>
                    <span className="diagram-arrow">→</span>
                    <div className="diagram-box box-tool">📄 找到文档</div>
                </div>
                <div className="diagram-row">
                    <div className="diagram-box box-tool">📄 文档喂给AI</div>
                    <span className="diagram-arrow">→</span>
                    <div className="diagram-box box-agent">🧠 AI理解</div>
                    <span className="diagram-arrow">→</span>
                    <div className="diagram-box box-output">💬 生成答案</div>
                </div>
            </div>
        </div>
    </section>
);

const LangChainSection=()=>(
    <section id="langchain" className="section">
        <h2 className="section-title"><span className="section-number">2</span>LangChain 核心组件</h2>
        <div className="emoji-big">🧱</div>
        <div className="analogy-box">
            <div className="analogy-title">🧱 LangChain = AI 应用的乐高积木盒</div>
            <p>你想搭个AI房子？有现成的墙、门、窗户！不用从砖头开始垒，直接拼积木就行！</p>
        </div>
        <h3 style={{marginTop:'40px',marginBottom:'20px'}}>🧩 核心积木一览</h3>
        <div className="grid-3">
            {[
                {icon:'📥',name:'Document Loaders',desc:'资料收集器 - 从PDF、网站、Word读文字',color:'#22c55e'},
                {icon:'🔪',name:'Text Splitters',desc:'切菜刀 - 把大段文字切成小块',color:'#f59e0b'},
                {icon:'🌐',name:'Embedding',desc:'翻译官 - 文字转AI看得懂的数字',color:'#6366f1'},
                {icon:'📚',name:'Vector Stores',desc:'图书馆书架 - 存放翻译好的数字',color:'#8b5cf6'},
                {icon:'🔎',name:'Retrievers',desc:'图书管理员 - 根据问题找资料',color:'#ec4899'},
                {icon:'💬',name:'Chat Models',desc:'说话的人 - AI组织语言回答',color:'#06b6d4'},
                {icon:'🧰',name:'Tools',desc:'工具箱 - 让AI能调用外部功能',color:'#14b8a6'},
                {icon:'🎖️',name:'Agents',desc:'指挥官 - 决定啥时候干啥事儿',color:'#f97316'},
                {icon:'🧠',name:'Memory',desc:'记性 - 记住之前的对话',color:'#a855f7'}
            ].map((item,i)=>(
                <div key={i} className="card">
                    <div className="card-title"><span style={{fontSize:'1.5rem',marginRight:'8px'}}>{item.icon}</span>{item.name}</div>
                    <p style={{color:'var(--text-secondary)',fontSize:'14px'}}>{item.desc}</p>
                </div>
            ))}
        </div>
        <h3 style={{marginTop:'40px',marginBottom:'20px'}}>🔗 组件协作流程</h3>
        <div className="diagram">
            <pre style={{fontFamily:'monospace',fontSize:'13px',lineHeight:'1.8'}}>{`
┌─────────────────────────────────────────────────┐
│         LangChain 组件协作流程                    │
├─────────────────────────────────────────────────┤
│  📥 输入: Text → Loaders → Splitters → Docs    │
│  🔢 存储: Docs → Embedding → Vectors → Store    │
│  🔍 检索: Query → Embed → Retrieve → Context    │
│  🤖 生成: LLM + Tools + Context → Response     │
└─────────────────────────────────────────────────┘`}</pre>
        </div>
        <div className="card" style={{background:'linear-gradient(135deg,#1a1a2e,#0f172a)'}}>
            <div className="card-title"><span className="card-icon" style={{background:'#6366f1'}}>💻</span>代码示例：5分钟搭建 RAG</div>
            <div className="code-block"><pre>{`# 1. 加载文档
loader = WebBaseLoader("https://example.com")
docs = loader.load()

# 2. 切分文本
splitter = RecursiveCharacterTextSplitter(chunk_size=1000)
splits = splitter.split_documents(docs)

# 3. 存入向量数据库
vectorstore = Chroma.from_documents(splits, embeddings)

# 4. 创建检索器
retriever = vectorstore.as_retriever()

# 5. 拼上 LLM 完成 RAG！
rag_chain = retriever | ChatOpenAI()
response = rag_chain.invoke("你的问题")`}</pre></div>
        </div>
    </section>
);

const RAGModesSection=()=>{
    const [activeMode,setActiveMode]=useState('2step');
    return(
        <section id="rag-modes" className="section">
            <h2 className="section-title"><span className="section-number">3</span>RAG 的三种模式</h2>
            <div style={{display:'flex',gap:'8px',marginBottom:'24px',flexWrap:'wrap',justifyContent:'center'}}>
                <div className={`mode-indicator ${activeMode==='2step'?'active':''}`} onClick={()=>setActiveMode('2step')} style={{borderColor:activeMode==='2step'?'#22c55e':'#475569'}}>
                    <h3>⚡ 2-Step RAG</h3>
                    <p>简单粗暴型</p>
                    <span className="tag tag-fast" style={{marginTop:'12px'}}>适合 FAQ</span>
                </div>
                <div className={`mode-indicator ${activeMode==='agentic'?'active':''}`} onClick={()=>setActiveMode('agentic')} style={{borderColor:activeMode==='agentic'?'#8b5cf6':'#475569'}}>
                    <h3>🧠 Agentic RAG</h3>
                    <p>聪明灵活型</p>
                    <span className="tag tag-variable" style={{marginTop:'12px'}}>适合复杂推理</span>
                </div>
                <div className={`mode-indicator ${activeMode==='hybrid'?'active':''}`} onClick={()=>setActiveMode('hybrid')} style={{borderColor:activeMode==='hybrid'?'#f59e0b':'#475569'}}>
                    <h3>⚖️ Hybrid RAG</h3>
                    <p>双管齐下型</p>
                    <span className="tag tag-medium" style={{marginTop:'12px'}}>适合生产环境</span>
                </div>
            </div>
            {activeMode==='2step'&&(
                <div className="card" style={{borderLeft:'4px solid #22c55e'}}>
                    <div className="card-title"><span className="card-icon" style={{background:'#22c55e'}}>⚡</span>2-Step RAG：先检索，再生成</div>
                    <p style={{color:'var(--text-secondary)',marginBottom:'20px'}}>就像去医院挂号：护士问诊（检索）→ 医生看病（生成）。简单直接！</p>
                    <div className="diagram"><div className="diagram-row">
                        <div className="diagram-box box-input">❓</div><span className="diagram-arrow">→</span>

from typing import TypedDict

class RAGState(TypedDict):
    query: str
    intent: str | None
    retrieved_docs: list[str]
    answer: str | None

def classify(state): intent = llm.invoke(f"判断: {state['query']}"); return {"intent": intent}
def retrieve(state): docs = retriever.invoke(state["query"]); return {"retrieved_docs": docs}
def generate(state): answer = llm.invoke(f"Q: {state['query']}\\nDocs: {state['retrieved_docs']}"); return {"answer": answer}

graph = (StateGraph(RAGState)
    .add_node("classify", classify)
    .add_node("retrieve", retrieve)
    .add_node("generate", generate)
    .add_edge(START, "classify")
    .add_edge("classify", "retrieve")
    .add_edge("retrieve", "generate")
    .add_edge("generate", END)
    .compile())`}</pre></div>

            <p>封装四库工具 → 设计工作流程 → 添加记忆 → 测试验证</p>
        </div>
        <div className="warning-box" style={{marginTop:'24px'}}>
            <div className="warning-title">⚠️ 记住三句话</div>
            <p style={{marginTop:'8px'}}><strong>1.</strong> RAG = AI 查资料：不用啥都靠死记硬背</p>
            <p><strong>2.</strong> LangGraph = AI 工作流：画流程图让AI按规矩干活</p>
            <p><strong>3.</strong> Memory = AI 记性：短期记聊天，长期记偏好</p>
        </div>
    </section>
);

const Footer=()=>(
    <footer className="footer">
        <div className="container">
            <p>LangChain RAG 架构完全指南 · 生成时间: {new Date().toLocaleDateString('zh-CN')}</p>
            <p style={{marginTop:'8px'}}>🎓 → 🧠 → 🛠️ → 🚂 → 👥 → 💾</p>
        </div>
    </footer>
);

const App=()=>{
    const [activeSection,setActiveSection]=useState('overview');
    useEffect(()=>{
        const observer=new IntersectionObserver(
            entries=>{
                entries.forEach(entry=>{
                    if(entry.isIntersecting)setActiveSection(entry.target.id);
                });
            },
            {threshold:0.3}
        );
        document.querySelectorAll('section[id]').forEach(s=>observer.observe(s));
        return()=>observer.disconnect();
    },[]);
    return(
        <div>
            <Header/>
            <Navigation activeSection={activeSection} setActiveSection={setActiveSection}/>
            <main className="main-content">
                <div className="container">
                    <OverviewSection/>
                    <WhatIsRAGSection/>
                    <LangChainSection/>
                    <RAGModesSection/>
                    <LangGraphSection/>
                    <MultiAgentSection/>
                    <MemorySection/>
                    <IntegrationSection/>
                    <SummarySection/>
                </div>
            </main>
            <Footer/>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>

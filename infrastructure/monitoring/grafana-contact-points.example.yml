# Grafana Contact Points Configuration Example
# Copy to grafana-contact-points.yml and configure your notification channels
# Related: Issue #129 Task 3

apiVersion: 1

contactPoints:
  - orgId: 1
    name: rag-team-slack
    receivers:
      - uid: slack_rag_team
        type: slack
        settings:
          url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
          title: "{{ .GroupLabels.alertname }}"
          text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
        disableResolveMessage: false

  - orgId: 1
    name: rag-team-email
    receivers:
      - uid: email_rag_team
        type: email
        settings:
          addresses: "rag-team@example.com"
          singleEmail: true
        disableResolveMessage: false

  - orgId: 1
    name: rag-oncall-pagerduty
    receivers:
      - uid: pagerduty_rag_oncall
        type: pagerduty
        settings:
          integrationKey: "YOUR_PAGERDUTY_INTEGRATION_KEY"
          severity: "{{ .GroupLabels.severity }}"
        disableResolveMessage: false

notification_policies:
  - orgId: 1
    receiver: rag-team-slack
    group_by:
      - alertname
      - component
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Critical alerts to PagerDuty
      - receiver: rag-oncall-pagerduty
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 30m

      # Warning alerts to Slack
      - receiver: rag-team-slack
        matchers:
          - severity = warning
        group_wait: 1m
        repeat_interval: 2h

      # Info alerts to Email only
      - receiver: rag-team-email
        matchers:
          - severity = info
        group_wait: 5m
        repeat_interval: 12h


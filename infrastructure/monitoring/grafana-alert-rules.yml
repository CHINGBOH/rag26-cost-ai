# Grafana Alert Rules for RAG Learning System
# Related: Issue #129 Task 3
# Auto-generated: 2026-05-08

groups:
  - name: rag_learning_system_alerts
    interval: 1m
    rules:
      # 1. Queue Backlog Alert
      - alert: RetestQueueBacklog
        expr: retest_queue_size{status="pending"} > 50
        for: 5m
        labels:
          severity: warning
          component: learning_system
          team: rag
        annotations:
          summary: "Retest queue backlog detected"
          description: "Pending retest queue size is {{ $value }}, exceeds threshold of 50 for 5 minutes"
          runbook_url: "https://github.com/CHINGBOH/RAG26/blob/main/infrastructure/monitoring/README.md#queue-backlog"

      # 2. High Failure Rate Alert
      - alert: HighFailureRate
        expr: failure_monitor_rate > 0.25
        for: 10m
        labels:
          severity: critical
          component: learning_system
          team: rag
        annotations:
          summary: "High failure rate detected"
          description: "Failure rate is {{ $value | humanizePercentage }}, exceeds threshold of 25% for 10 minutes"
          runbook_url: "https://github.com/CHINGBOH/RAG26/blob/main/infrastructure/monitoring/README.md#high-failure-rate"

      # 3. Retest Execution Performance Degradation
      - alert: RetestExecutionSlow
        expr: histogram_quantile(0.95, rate(retest_execution_duration_seconds_bucket[5m])) > 300
        for: 15m
        labels:
          severity: warning
          component: learning_system
          team: rag
        annotations:
          summary: "Retest execution performance degraded"
          description: "P95 retest execution duration is {{ $value }}s, exceeds 300s threshold for 15 minutes"
          runbook_url: "https://github.com/CHINGBOH/RAG26/blob/main/infrastructure/monitoring/README.md#slow-retest"

      # 4. Abnormal Deduplication Rate
      - alert: AbnormalDeduplicationRate
        expr: retest_deduplication_rate{window="24h"} > 0.3
        for: 30m
        labels:
          severity: info
          component: learning_system
          team: rag
        annotations:
          summary: "Abnormal retest deduplication rate"
          description: "24h deduplication rate is {{ $value | humanizePercentage }}, exceeds 30% for 30 minutes. This may indicate repeated failures or configuration issues."
          runbook_url: "https://github.com/CHINGBOH/RAG26/blob/main/infrastructure/monitoring/README.md#high-dedup-rate"

      # 5. Learning Loop Stalled
      - alert: LearningLoopStalled
        expr: increase(learning_loop_count[1h]) == 0 and hour() >= 2 and hour() < 4
        for: 30m
        labels:
          severity: warning
          component: learning_system
          team: rag
        annotations:
          summary: "Learning loop may be stalled"
          description: "No learning loop executions detected in the past hour during scheduled time (2:00-4:00 UTC)"
          runbook_url: "https://github.com/CHINGBOH/RAG26/blob/main/infrastructure/monitoring/README.md#stalled-loop"

      # 6. Retest Queue Near Capacity
      - alert: RetestQueueNearCapacity
        expr: retest_queue_size{status="pending"} > 100
        for: 30m
        labels:
          severity: critical
          component: learning_system
          team: rag
        annotations:
          summary: "Retest queue near capacity"
          description: "Pending queue size {{ $value }} exceeds 100 for 30 minutes. System may be overwhelmed."
          runbook_url: "https://github.com/CHINGBOH/RAG26/blob/main/infrastructure/monitoring/README.md#queue-capacity"

      # 7. High Retry Rate
      - alert: HighRetryRate
        expr: rate(retest_retry_total[10m]) > 0.5
        for: 20m
        labels:
          severity: warning
          component: learning_system
          team: rag
        annotations:
          summary: "High retest retry rate detected"
          description: "Retry rate is {{ $value }}/min for 20 minutes. Check for systemic issues."
          runbook_url: "https://github.com/CHINGBOH/RAG26/blob/main/infrastructure/monitoring/README.md#high-retry"


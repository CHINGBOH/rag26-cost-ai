version: "3.8"

# Distributed tracing stack for #87 Phase 4 — service graph generation.
#
# Pipeline:
#   retrieval-service (OTEL SDK)
#     ─OTLP/HTTP→  Tempo :4318 ← also accepts gRPC :4317
#                   │
#                   ├─ stores traces locally
#                   └─ metrics-generator emits service-graph metrics:
#                        traces_service_graph_request_total{client,server}
#                        traces_service_graph_request_server_seconds_*
#                   ─Prometheus remote-write→ Prometheus :9091
#
#   Grafana :3001
#     ├─ datasource Tempo  → trace explorer + native ServiceGraph view
#     └─ datasource Prom   → service-graph metrics for ranking
#
# Bring up:
#   docker-compose -f infrastructure/docker-compose.tracing.yml up -d
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318/v1/traces \
#     <restart retrieval-service>
#   open http://localhost:3001  (admin / admin)
#     Explore → Tempo → Service Graph

services:
  tempo:
    image: grafana/tempo:2.5.0
    container_name: rag-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # tempo http (query)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: rag-tracing-prom
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./tempo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tracing-prom-data:/prometheus
    ports:
      - "9092:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: rag-tracing-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor traceQLStreaming metricsSummary
    volumes:
      - ./tempo/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - tracing-grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - tempo
      - prometheus
    restart: unless-stopped

volumes:
  tempo-data:
  tracing-prom-data:
  tracing-grafana-data:
